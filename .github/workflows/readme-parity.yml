name: README parity

# Bilingual docs double the surface a quiet mistake can live on. This
# repository and Friday have both shipped one: a count corrected in one file
# and not the other, and a stale Chinese term left inside the English file
# where a language-by-language check could not see it.

on:
  pull_request:
    paths:
      - "README.md"
      - "README.zh-TW.md"
      - "scripts/check-readme-parity.py"
      - "scripts/readme-stale-terms.txt"
      - ".github/workflows/readme-parity.yml"
  push:
    branches-ignore:
      - main
    paths:
      - "README.md"
      - "README.zh-TW.md"
      - "scripts/check-readme-parity.py"
      - "scripts/readme-stale-terms.txt"
      - ".github/workflows/readme-parity.yml"

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The two READMEs agree on structure, numbers, links and terms
        run: |
          python3 scripts/check-readme-parity.py \
            README.md README.zh-TW.md scripts/readme-stale-terms.txt
